spring:

  application:
    name: CodingPlatform

  datasource:
    url: jdbc:postgresql://localhost:5432/codingplatform
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8
    validate-on-migrate: false


jwt:
  secret: mycodingplatform2026jwtsecretkey
  expiration: 86400000


logging:
  level:
    org.springframework: INFO


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

  api-docs:
    path: /v3/api-docs