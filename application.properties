spring.application.name=coding-platform
server.port=8080

# ---------------------------------------------------
# PostgreSQL Datasource
# ---------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/coding_platform
spring.datasource.username=avinash
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------
# Flyway
# ---------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------
# JWT
# ---------------------------------------------------
app.jwt.secret=ChangeThisSecretKeyToASecureRandomValueOfAtLeast256BitsForHS256Signing
app.jwt.expiration-ms=86400000

# ---------------------------------------------------
# Swagger / springdoc
# ---------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------
# Submission rate limiting
# ---------------------------------------------------
app.submission.rate-limit.max-per-minute=5
